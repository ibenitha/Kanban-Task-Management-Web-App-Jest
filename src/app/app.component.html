<!-- Reachable as the very first focus stop, jumps keyboard/screen-reader
     users past the sidebar straight to the page content. -->
<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">
  <header class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
      </div>
      FlowBoard
    </div>

    <span class="sidebar__section-label">Navigation</span>

    <nav class="sidebar__nav" aria-label="Main">
      <!-- routerLinkActive adds the given class to this link whenever its
           routerLink matches the current URL. [routerLinkActiveOptions]
           = { exact: false } is deliberate here: without it, this link
           would only be "active" at exactly /boards — exact: false keeps
           it active anywhere under /boards/... too. -->
      <a
        routerLink="/boards"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
        ariaCurrentWhenActive="page"
      >
        <svg class="sidebar__nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        Boards
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="sidebar__link--active"
        ariaCurrentWhenActive="page"
      >
        <svg class="sidebar__nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
    </nav>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <!-- A subtle indicator driven by NavigationService, itself driven by
         Router events — visible only while a navigation is actually in
         flight, never a fake timed delay. -->
    <div
      class="loading-bar"
      [class.loading-bar--active]="navigation.isNavigating"
      aria-hidden="true"
    ></div>

    <p class="nav-error" *ngIf="navigation.navigationError" role="alert">
      {{ navigation.navigationError }}
    </p>

    <!-- Service-based shared state on screen: whatever NotificationService's
         BehaviorSubject last published, read here with the async pipe.
         TESTING LAB: displayed by ToastComponent (@Input notification, @Output dismissed). -->
    <app-toast
      *ngIf="notifications.notification$ | async as note"
      [notification]="note"
      (dismissed)="notifications.clear()"
    ></app-toast>

    <router-outlet></router-outlet>
  </main>
</div>
